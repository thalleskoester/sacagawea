[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[lint.flake8-bugbear]
# Framework-specific defaults stay in the shared base so projects get the same
# behavior when they enable related rule sets from `pyproject.toml`.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[lint.flake8-builtins]
ignorelist = ["id"]
strict-checking = true

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-row-type = "tuple"
parametrize-values-type = "list"

[lint.flake8-type-checking]
exempt-modules = [
    "typing",
    "typing_extensions"
]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.RootModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "attr.attrs",
    "attr.define",
    "attr.frozen",
    "attr.s",
    "attrs.define",
    "attrs.frozen",
    "attrs.mutable",
    "fastapi.APIRouter.api_route",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.trace",
    "fastapi.APIRouter.websocket",
    "fastapi.APIRouter.websocket_route",
    "fastapi.FastAPI.api_route",
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.head",
    "fastapi.FastAPI.options",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.trace",
    "fastapi.FastAPI.websocket",
    "fastapi.FastAPI.websocket_route",
    "fastmcp.FastMCP.custom_route",
    "fastmcp.FastMCP.prompt",
    "fastmcp.FastMCP.resource",
    "fastmcp.FastMCP.tool",
    "fastmcp.prompts.prompt",
    "fastmcp.resources.resource",
    "fastmcp.tools.tool",
    "pydantic.dataclasses.dataclass",
    "pydantic.validate_call",
    "typer.Typer.callback",
    "typer.Typer.command",
]

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.flake8-import-conventions.extend-aliases]
"matplotlib" = "mpl"
"matplotlib.pyplot" = "plt"
"numpy" = "np"
"numpy.typing" = "npt"
"pandas" = "pd"
"tensorflow" = "tf"

[lint.pep8-naming]
classmethod-decorators = [
    # Do not add `pydantic.model_validator` here; `mode="after"` validators
    # are instance methods, while before/wrap validators should use an
    # explicit `@classmethod`.
    "pydantic.field_validator",
    "pydantic.root_validator",
    "pydantic.validator",
    "declared_attr",
    "expression",
    "comparator"
]

[lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 88

[lint.pydoclint]
ignore-one-line-docstrings = true

[lint.pydocstyle]
convention = "pep257"
ignore-decorators = [
    "typing.overload"
]

[lint.pyupgrade]
keep-runtime-typing = true
