cache-dir = "./storage/cache/ruff"
force-exclude = true
indent-width = 4
line-length = 120

[format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
# Format all docstring code snippets using a stricter fixed line length than
# the surrounding Python code.
docstring-code-line-length = 88
exclude = []
indent-style = "space"
line-ending = "auto"
nested-string-quote-style = "alternating"
# Disable preview style formatting until the team has reviewed it.
preview = false
quote-style = "double"
skip-magic-trailing-comma = false

[lint]
allowed-confusables = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
exclude = []
explicit-preview-rules = true
external = []
fixable = ["ALL"]
future-annotations = true
preview = true
